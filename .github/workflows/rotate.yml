name: Rotate passphrase

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Re-encrypt with the new passphrase
        run: node scripts/rotate.mjs
        env:
          OLD_PASSPHRASE: ${{ secrets.OLD_PASSPHRASE }}
          OFFICE_PASSPHRASE: ${{ secrets.OFFICE_PASSPHRASE }}
      - name: Commit encrypted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.enc.json
          if git diff --staged --quiet; then
            echo "no file change"
            exit 0
          fi
          git commit -m "rotate encrypted office data"
          git push
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
