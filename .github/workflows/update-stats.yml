name: Update note stats

on:
  schedule:
    # minute 15 of every hour (UTC)
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh public note stats
        run: node scripts/update-stats.mjs
        env:
          OFFICE_PASSPHRASE: ${{ secrets.OFFICE_PASSPHRASE }}
          NOTE_ACCOUNTS: ${{ secrets.NOTE_ACCOUNTS }}
      - name: Commit encrypted data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.enc.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no stat changes; skip commit and deploy"
            exit 0
          fi
          git commit -m "update encrypted office data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.commit.outputs.changed == 'true'
        run: npm ci
      - if: steps.commit.outputs.changed == 'true'
        run: npm run build
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
